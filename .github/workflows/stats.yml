name: Refresh profile cards

on:
  schedule:
    - cron: "23 2 * * *" # nightly, off-peak for GitHub's shared runners
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Keeps the job from burning minutes (and failing on a read-only token) in forks.
    if: github.repository == 'manjunathshiva/manjunathshiva'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        run: python scripts/gen_stats.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # .ipynb byte counts include stored cell output, which would otherwise
          # rank a handful of workshop notebooks above every line of C.
          EXCLUDE_LANGUAGES: Jupyter Notebook

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/ README.md
          # [skip ci] stops this push from re-triggering the push trigger above.
          if git diff --cached --quiet; then
            echo "cards unchanged"
          else
            git commit -m "chore: refresh profile cards [skip ci]"
            git push
          fi
